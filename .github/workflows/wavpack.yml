name: WavPack lossless compression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lossless:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    env:
      NEURO_PY_REQUIRE_WAVPACK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build WavPack 5.9.0 on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/wavpack-5.9.0.tar.xz"
          prefix="$RUNNER_TEMP/wavpack-tools"
          curl --fail --location --retry 3 'https://github.com/dbry/WavPack/releases/download/5.9.0/wavpack-5.9.0.tar.xz' --output "$archive"
          # SHA-256 published by the official GitHub release asset metadata.
          python -c 'import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); sys.exit(0 if actual == "b5291bc4e6d69ebbd3da3800c5bf4a70f19bb92679b23e09b3b612c1e648d1ff" else "WavPack download checksum mismatch")' "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/wavpack-5.9.0"
          ./configure --prefix="$prefix" --disable-shared --disable-dependency-tracking
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install WavPack on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wavpack-5.9.0-x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'wavpack-5.9.0'
          Invoke-WebRequest -Uri 'https://github.com/dbry/WavPack/releases/download/5.9.0/wavpack-5.9.0-x64.zip' -OutFile $archive
          # SHA-256 published by the official GitHub release asset metadata.
          $expected = 'ad5e94bcde6f4edfc859210d98f144f225805a391c633c68f6dbb15a9e52570e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'WavPack download checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check codec installation
        run: |
          wavpack --version
          wvunpack --version

      - name: Install neuro_py and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Test lossless compression and restoration
        run: python tools/run_pytest.py tests/raw/test_wavpack.py tests/raw/test_wavpack_publication.py -v
